name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install ruff==0.17.3
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Offline unit tests
        env:
          MLFLOW_DISABLE_AGENT_HINT: '1'
        run: python -B -m unittest discover -s tests/unit -v
      - name: Import smoke test
        run: python -c "from adaptivephish.api.app import app; assert app.title == 'AdaptivePhish API'"
      - name: Package wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Build clean image without private model
        run: docker build -t adaptivephish:ci .
      - name: Validate deployment shell
        run: bash -n deploy/aws/deploy.sh
