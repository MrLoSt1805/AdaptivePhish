name: Manual image publication and deployment
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured, already provisioned EC2 host
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.name }}:${{ github.sha }}
      - id: reference
        env:
          NAME: ${{ steps.name.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    if: inputs.deploy
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with pinned host identity and automatic rollback
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MODEL_SHA256: ${{ secrets.MODEL_SHA256 }}
          IMAGE: ${{ needs.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$MODEL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$IMAGE" =~ ^[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes deploy/aws/deploy.sh "$DEPLOY_USER@$HOST:/tmp/adaptivephish-deploy.sh"
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" "bash /tmp/adaptivephish-deploy.sh '$IMAGE' /opt/adaptivephish/model.joblib '$MODEL_SHA256'"
