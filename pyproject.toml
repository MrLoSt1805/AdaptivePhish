[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivephish"
version = "0.1.0"
description = "Academic phishing URL detection research with temporal drift detection and automated retraining."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyarrow==26.0.0",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "xgboost>=2.0,<4",
    "lightgbm>=4.3,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adaptivephish*"]
namespaces = false
